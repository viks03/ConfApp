<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="bg" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="date=no" />
    <meta name="format-detection" content="address=no" />
    <title>{EmailSubject}</title>

    <!--[if mso]>
    <xml>
      <o:OfficeDocumentSettings>
        <o:AllowPNG/>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->

    <style type="text/css">
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }

        .ExternalClass { width: 100%; }
        .ExternalClass, .ExternalClass p, .ExternalClass span,
        .ExternalClass font, .ExternalClass td, .ExternalClass div { line-height: 100%; }

        a[x-apple-data-detectors] {
            color: inherit !important; text-decoration: none !important;
            font-size: inherit !important; font-family: inherit !important;
            font-weight: inherit !important; line-height: inherit !important;
        }
        u + #body a { color: inherit; text-decoration: none; }

        @media screen and (max-width: 620px) {
            .container   { width: 100% !important; max-width: 100% !important; }
            .mobile-pad  { padding-left: 22px !important; padding-right: 22px !important; }
            .code-text   { font-size: 32px !important; letter-spacing: 7px !important; }
            .brand-logo  { width: 34px !important; }
            /* Името до логото трябва да остане на един ред — на тесен екран
               слизаме с размера, вместо да позволим пренасяне. */
            .brand-name  { font-size: 15px !important; letter-spacing: 0.3px !important; }
            .logo-height { height: 26px !important; }
            /* БЪГ ФИКС: тук стоеше `width:100%` ЗАЕДНО с хоризонтален padding.
               В имейл box-sizing по подразбиране е content-box, тоест
               100% + 20px + 20px = съдържанието излиза 40px извън картата.
               Точно това правеше сивия блок със статуса да стърчи вдясно.
               `box-sizing:border-box` прибира padding-а вътре в ширината;
               `auto` е допълнителна застраховка за клиентите, които го
               игнорират. */
            .stack       { display: block !important; box-sizing: border-box !important; width: auto !important; max-width: 100% !important; text-align: left !important; padding-left: 20px !important; padding-right: 20px !important; padding-bottom: 0 !important; border-bottom: 0 !important; }
            .stack-value { display: block !important; box-sizing: border-box !important; width: auto !important; max-width: 100% !important; text-align: left !important; padding-top: 2px !important; padding-bottom: 13px !important; border-bottom: 1px solid #E2E8F0 !important; }
        }

        /* Outlook.com пренаписва цветовете; правилата по долу ги връщат. */
        [data-ogsc] .page-bg   { background-color: #EEF2F6 !important; }
        [data-ogsb] .page-bg   { background-color: #EEF2F6 !important; }
        [data-ogsc] .card-bg   { background-color: #FFFFFF !important; }
        [data-ogsb] .card-bg   { background-color: #FFFFFF !important; }
        [data-ogsc] .soft-bg   { background-color: #F7F9FB !important; }
        [data-ogsb] .soft-bg   { background-color: #F7F9FB !important; }
        [data-ogsc] .txt       { color: #131C25 !important; }
        [data-ogsc] .txt-2     { color: #4A5A6B !important; }
        [data-ogsc] .txt-3     { color: #7B8794 !important; }
        [data-ogsc] .txt-accent { color: #FF3636 !important; }
        [data-ogsc] .txt-ok    { color: #16A34A !important; }
        [data-ogsc] .txt-info  { color: #2563EB !important; }
        [data-ogsc] .btn-txt   { color: #FFFFFF !important; }
    </style>
</head>

<body id="body" class="page-bg" bgcolor="#EEF2F6" style="margin:0; padding:0; background-color:#EEF2F6; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

    <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;
                font-size:1px; color:#EEF2F6; line-height:1px; max-width:0px; opacity:0;">
        {Preheader}&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
        &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
        &zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;
    </div>

    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
           bgcolor="#EEF2F6" class="page-bg" style="background-color:#EEF2F6;">
        <tr>
            <td align="center" style="padding:36px 10px;">

                <!--[if mso]>
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600"><tr><td>
                <![endif]-->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600"
                       bgcolor="#FFFFFF" class="container card-bg"
                       style="background-color:#FFFFFF; border:1px solid #E2E8F0; max-width:600px; width:100%;">

                    <tr>
                        <td bgcolor="#FF3636" style="height:3px; background-color:#FF3636; font-size:0; line-height:0; mso-line-height-rule:exactly;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td class="mobile-pad" bgcolor="#FFFFFF" style="padding-left:40px; padding-right:40px; padding-top:28px; padding-bottom:24px; background-color:#FFFFFF; border-bottom:2px solid #131C25;">
                            <!-- Лого + име, точно както в шапката на сайта:
                                 логото е 40px, текстът ~17px с тегло 500. Двете са в
                                 таблица, защото Word engine не поддържа flex, а
                                 vertical-align на клетка работи навсякъде.
                                 Редът "UNWE · ICBI" е премахнат — темата на писмото
                                 казва същото и в известието се повтаряше. -->
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td valign="middle" style="padding-right:11px;">
                                        <!-- alt="" нарочно: името стои в текста
                                             отдясно. С alt текст при блокирани
                                             изображения "Blockchain Education 2026"
                                             се показваше два пъти едно до друго. -->
                                        <img src="{BaseUrl}/images/logos/mainLogo-dark.png"
                                             alt="" width="40" class="brand-logo"
                                             style="display:block; width:40px; height:auto; border:0;" />
                                    </td>
                                    <td valign="middle" class="txt brand-name"
                                        style="color:#131C25; font-size:17px; font-weight:500;
                                               letter-spacing:0.5px; white-space:nowrap;
                                               font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                                               line-height:1.25; mso-line-height-rule:exactly;">
                                        Blockchain&nbsp;Education&nbsp;2026
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

{Body}

                    <tr>
                        <td class="mobile-pad soft-bg" bgcolor="#F7F9FB"
                            style="padding-left:40px; padding-right:40px; padding-top:26px; padding-bottom:26px;
                                   background-color:#F7F9FB; border-top:1px solid #E2E8F0;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="padding-bottom:18px; border-bottom:1px solid #E2E8F0;">
                                        <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td valign="middle" style="padding-right:18px;">
                                                    <img src="{BaseUrl}/images/logos/UNWE-dark.png" alt="UNWE" height="30"
                                                         class="logo-height" style="display:block; height:30px; width:auto;" />
                                                </td>
                                                <td valign="middle" style="padding-right:18px;">
                                                    <img src="{BaseUrl}/images/logos/ICBI-dark.png" alt="ICBI" height="30"
                                                         class="logo-height" style="display:block; height:30px; width:auto;" />
                                                </td>
                                                <td valign="middle">
                                                    <img src="{BaseUrl}/images/logos/NABI-dark.png" alt="NABI" height="30"
                                                         class="logo-height" style="display:block; height:30px; width:auto;" />
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding-top:16px;">
                                        <p class="txt-3" style="color:#7B8794; font-size:11px; text-transform:uppercase;
                                                  letter-spacing:0.8px; font-weight:500; margin:0;
                                                  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                                                  line-height:1.6; mso-line-height-rule:exactly;">{FooterRights}</p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>

                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="600"
                       class="container" style="max-width:600px; width:100%;">
                    <tr>
                        <td bgcolor="#FF3636" style="height:2px; background-color:#FF3636; font-size:0; line-height:0; mso-line-height-rule:exactly;">&nbsp;</td>
                    </tr>
                </table>
                <!--[if mso]>
                </td></tr></table>
                <![endif]-->

            </td>
        </tr>
    </table>

</body>
</html>
